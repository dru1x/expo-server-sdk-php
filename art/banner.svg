<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Decorative accent line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- Decorative circles (subtle) -->
  <circle cx="1100" cy="80" r="180" fill="#ffffff" fill-opacity="0.02"/>
  <circle cx="1150" cy="320" r="120" fill="#6366f1" fill-opacity="0.05"/>
  <circle cx="180" cy="340" r="200" fill="#ffffff" fill-opacity="0.015"/>

  <!-- Title -->
  <text
    x="640"
    y="190"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-1"
  >Expo Push Server SDK (PHP)</text>

  <!-- Divider -->
  <rect x="520" y="215" width="240" height="2" fill="url(#accent)" rx="1"/>

  <!-- Subtitle -->
  <text
    x="640"
    y="268"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#94a3b8"
    text-anchor="middle"
    letter-spacing="0.5"
  >Server-side library for working with the Expo push notification service using PHP 8.2+</text>
</svg>
